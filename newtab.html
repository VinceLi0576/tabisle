<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书签</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <span class="brand">书签</span>
    <span class="count" id="total"></span>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜书签" title="按 / 直接跳到这里" autocomplete="off" spellcheck="false">
  </div>
  <div class="bar-actions">
    <span class="pill-duo">
      <button type="button" class="pill pill-l" id="ai-setup-btn" title="AI 整理标准：写规矩、编常用任务、填钥匙">⚙</button>
      <button type="button" class="pill pill-r pill-on" id="ai-side" title="在右侧栏打开 AI 对话">✦ AI</button>
    </span>
    <!-- 备份和同步本来就是同一页，合成一个药丸：没配同步时显示「备份与恢复」，配了就显示云端状态 -->
    <button class="pill" id="sync-pill" type="button" title="备份、恢复与多设备同步">☁ 备份与恢复</button>
    <button class="pill sync-go" id="sync-go" type="button" hidden title="立刻同步一次：把本机改动传上去、把云端新东西拉下来">⟳ 同步</button>
  </div>
  <!-- 🔴 顶栏不再摆输入框（AI 全部走右侧栏），但这一块不能删：ai.js 按 id 直接抓这些元素 -->
  <div class="ai-bar" id="ai-bar" hidden>
    <button class="chev ai-gear" id="ai-settings" type="button" title="Kimi 设置">⚙</button>
    <input id="ai-input" type="text" autocomplete="off">
    <button type="button" class="btn" id="ai-send">发送</button>
    <button type="button" class="chev" id="ai-toggle">▾</button>
  </div>
  <div class="ai-panel" id="ai-panel" hidden>
    <div class="ai-panel-head"><span id="ai-status"></span><span style="flex:1"></span><button class="chev" id="ai-clear" type="button" title="清空对话">⌫</button><button class="chev" id="ai-close" type="button" title="收起">×</button></div>
    <div class="ai-quick" id="ai-quick"></div>
    <div class="ai-log" id="ai-log"></div>
    <div class="ai-proposal" id="ai-proposal" hidden></div>
  </div>
  <div class="topright">
    <div class="weather" id="weather" title="点一下刷新天气"><span class="w-ico" id="w-ico"></span><div class="w-txt"><span class="w-temp" id="w-temp"></span><span class="w-city" id="w-city"></span></div></div>
    <div class="clock" id="clock"><span class="time" id="clock-time"></span><div class="clock-sub"><span class="date" id="clock-date"></span><span class="week" id="clock-week"></span></div></div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="seg" data-key="view" title="显示方式：紧凑两行 · 详细多露书签名/详细说明/最近打开 · 列表"><button data-val="card">紧凑</button><button data-val="detail">详细</button><button data-val="list">列表</button></div>
  <button class="btn ghost" id="organize-btn" title="所有分组排成一棵树：改顺序、改归属、就地新建">分组整理</button>
  <button class="btn ghost" id="more-btn" title="更多">⋯</button>
  <span class="tb-sep"></span>
  <span class="tb-label">标签</span>
  <div class="intro-tags tb-tags" id="intro-tags"></div>
  <span class="seg mini-seg" id="filter-mode" title="选了多个标签时：都要有 / 有一个就行"><button data-val="and" class="on">且</button><button data-val="or">或</button></span>
  <button class="legend-clear" id="filter-clear" hidden>清除筛选</button>
  <div class="fold-bar" id="fold-bar">
    <span class="tb-label">默认</span>
    <div class="seg mini-seg" data-key="foldDefault" title="没单独设过的文件夹，打开页面时按这个来"><button data-val="auto">自定</button><button data-val="closed">折叠</button><button data-val="open">展开</button></div>
    <button class="ghost fold-act" id="fold-close" type="button" title="这一次全部折起来">全部折叠</button>
    <button class="ghost fold-act" id="fold-open" type="button" title="这一次全部展开">全部展开</button>
    <button class="ghost fold-act" id="fold-reset" type="button" title="清掉逐个设过的状态，回到上面选的默认">回到默认</button>
  </div>
</div>
<div class="layout">
<nav id="side" class="side"><div id="side-list"></div></nav>
<main id="main">
  <!-- 工作台：最近访问 / 快捷方式 / 收集箱 / 搜网页 四页合一，整块折叠（老徐 260915：
       「这三个组显示下来占的地方太多了，在顶部直接长期占用了三栏」⇒ 做成浏览器书签页那样的横排标签）-->
  <section class="recent deck" id="deck">
    <div class="recent-head deck-head" id="deck-head">
      <span class="level-mark" aria-hidden="true" style="--level-count:1"><i></i></span>
      <button class="folder-toggle" type="button" aria-expanded="true" aria-controls="deck-body" title="收起／展开这一整块"><svg viewBox="0 0 12 12"><path d="M3 4l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="deck-tabs" id="deck-tabs" role="tablist"></span>
      <button class="hd-view" type="button" data-viewof="__deck" title="这一块怎么显示：点一下在紧凑 / 详细之间切">紧凑</button>
    </div>
    <div class="note-card fixed" id="deck-note"></div>
    <div class="recent-body deck-body" id="deck-body"></div>
  </section>

  <section class="organize" id="organize" hidden></section>
  <section class="groups" id="groups"></section>
  <section class="results" id="results" hidden></section>
  <p class="empty" id="empty" hidden>书签栏是空的。点上方「＋ 新分组」开始。</p>
</main>

</div>

<div class="menu" id="menu" hidden></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h3 id="dlg-title">编辑</h3>
    <label id="dlg-alias-row">备注名（只在这页显示，书签栏不动）<input id="dlg-alias" autocomplete="off" placeholder="留空就显示书签名"></label>
    <label id="dlg-name-row"><span id="dlg-name-lbl">名称</span><input id="dlg-name" autocomplete="off"></label>
    <label id="dlg-url-row">地址<input id="dlg-url" autocomplete="off" spellcheck="false" placeholder="https://"></label>
    <div id="dlg-meta">
      <div class="dlg-tags"><span class="lbl">标签</span><span id="dlg-tag-list"></span></div>
      <label>一句话说明<input id="dlg-desc" autocomplete="off" placeholder="这是什么、用来干嘛"></label>
      <label>自定义图标：填一个 emoji，或一个图片地址（可空）<input id="dlg-icon" autocomplete="off" spellcheck="false" placeholder="🐙 或 https://…/logo.png"></label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="dlg-cancel">取消</button>
      <button type="submit" class="btn" id="dlg-ok">保存</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-tag">
  <form method="dialog" id="dlg-tag-form">
    <h3 id="dlg-tag-title">标签</h3>
    <div class="row2">
      <label>一个字<input id="tag-glyph" maxlength="2" autocomplete="off" placeholder="官"></label>
      <label>名称<input id="tag-name" autocomplete="off" placeholder="官网"></label>
    </div>
    <label>一句说明<input id="tag-desc" autocomplete="off" placeholder="产品或服务的官方入口"></label>
    <div class="dlg-tags"><span class="lbl">颜色</span><span class="palette" id="tag-palette"></span></div>
    <label class="tag-dim-row"><input type="checkbox" id="tag-dim"><span>打了这个标签的<b>排到最后</b>，而且显示成灰的（用来标「待整理」这类还没归位的）</span></label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost danger-text" id="tag-delete" hidden>删除这个标签</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="tag-cancel">取消</button>
      <button type="submit" class="btn" id="tag-ok">保存</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-ai">
  <form method="dialog" id="dlg-ai-form">
    <h3>Kimi 设置</h3>
    <p class="dlg-note">钥匙只存在这台浏览器的插件本机存储里，不进导出文件。到 platform.moonshot.cn 的「API Key 管理」生成一把贴进来。</p>
    <label>接口<select id="ai-provider">
      <option value="moonshot">Moonshot 开放平台（platform.moonshot.cn 的 Key，按量付费）</option>
      <option value="kimicode">Kimi Code 会员（kimi.com/code 控制台的 Key，走会员额度）</option>
    </select></label>
    <label>API Key<input id="ai-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…"></label>
    <div class="row2b">
      <label>模型<select id="ai-model"></select></label>
      <label>温度<input id="ai-temp" type="number" step="0.1" min="0" max="1"></label>
    </div>
    <input id="ai-base" type="hidden">
    <p class="dlg-note" id="ai-model-note"></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="ai-test">测试连接</button><span class="dlg-note" id="ai-test-out" style="flex:1;margin:0 8px"></span>
      <button type="button" class="btn ghost" id="ai-cancel">取消</button>
      <button type="submit" class="btn">保存</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-emoji">
  <form method="dialog" id="dlg-emoji-form">
    <h3>emoji 兜底库</h3>
    <p class="dlg-note">没有站点图标的网址，按下面的规则配一个 emoji：一行一条，「关键词 空格 emoji」，关键词匹配网址或名字（不分大小写），从上往下第一条命中的算。改完保存立即生效。</p>
    <textarea id="emoji-rules" rows="14" spellcheck="false"></textarea>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="emoji-reset">恢复默认</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="emoji-cancel">取消</button>
      <button type="submit" class="btn">保存</button>
    </div>
  </form>
</dialog>
<input type="file" id="import-file" accept="application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="bg.js"></script>
<script src="bm-core.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="widgets.js"></script>
<script src="ai-core.js"></script>
<script src="ai-providers.js"></script>
<script src="ai.js"></script>
</body>
</html>
